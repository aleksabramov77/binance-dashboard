name: Deploy

# Выкатка на свою VM apps-tokyo (AWS Lightsail, spec 0017, docs/ai/deploy-lightsail.md).
# На 512 МБ VM `next build` не помещается: собираем здесь (output: "standalone") и копируем готовый бандл.
# Прод — VM (spec 0055): каждый зелёный CI на main сам выкатывает VM (workflow_run). Ручной запуск — с любой ветки
# или коммита (повторная выкатка, проверка ветки). Vercel из main больше не выкатывается (vercel.json).
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: Ветка или коммит для выкатки
        required: true
        default: main

# Выкатки идут строго по очереди, новая не отменяет начатую.
concurrency:
  group: deploy-apps-tokyo
  cancel-in-progress: false

permissions:
  contents: read

env:
  PROJECT: binance # /srv/binance/app, binance.service (scripts/server/add-project.sh)
  PORT: 5000

jobs:
  deploy:
    name: build → rsync → restart
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Автовыкатка — только после успешного CI от push в main (не PR, не отменённый и не упавший прогон).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    env:
      VM_HOST: ${{ secrets.APPS_TOKYO_HOST }}
      VM_USER: ${{ secrets.APPS_TOKYO_USER }}
      VM_SSH_KEY: ${{ secrets.APPS_TOKYO_SSH_KEY }}
    steps:
      - name: Секреты заданы?
        run: |
          if [ -z "$VM_HOST" ] || [ -z "$VM_USER" ] || [ -z "$VM_SSH_KEY" ]; then
            echo "::error::Нет секретов APPS_TOKYO_HOST / APPS_TOKYO_USER / APPS_TOKYO_SSH_KEY (docs/ai/deploy-lightsail.md)."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          # workflow_run — ровно тот коммит, который проверил CI; ручной запуск — выбранная ветка или коммит.
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.ref }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build
        env:
          BUILD_STANDALONE: "1" # output: "standalone" (next.config.ts) — только для VM

      # server.js + трассированные node_modules + миграции drizzle/; static и public standalone не копирует сам.
      - name: Бандл
        run: |
          cp -R .next/static .next/standalone/.next/static
          cp -R public .next/standalone/public
          du -sh .next/standalone

      - name: SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VM_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -t ed25519 "$VM_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      # --delete: на VM остаётся ровно бандл. Код открытый (секреты — в /etc/<проект>/app.env), поэтому права 755/644:
      # deploy не в группе проекта и не может отдать файлы группе сервиса. .next/cache — ссылка на /var/lib/<проект>/cache.
      - name: Копирование на VM
        run: |
          rsync -rlptz --delete --chmod=D755,F644 --exclude '.next/cache' \
            .next/standalone/ "$VM_USER@$VM_HOST:/srv/$PROJECT/app/"
          ssh "$VM_USER@$VM_HOST" "ln -sfn /var/lib/$PROJECT/cache /srv/$PROJECT/app/.next/cache"

      - name: Перезапуск и проверка
        run: |
          ssh "$VM_USER@$VM_HOST" bash -s <<EOF
          set -e
          sudo /usr/bin/systemctl enable $PROJECT
          sudo /usr/bin/systemctl restart $PROJECT
          for i in \$(seq 1 60); do
            code=\$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 http://127.0.0.1:$PORT/ || true)
            # 2xx–4xx (в т.ч. редирект на вход) — сервер жив; 5xx — сбой (например, вход не настроен).
            if [ "\$code" -ge 200 ] && [ "\$code" -lt 500 ]; then echo "OK: 127.0.0.1:$PORT → \$code"; exit 0; fi
            sleep 2
          done
          sudo /usr/bin/journalctl -u $PROJECT -n 80 --no-pager
          echo "::error::$PROJECT не ответил 2xx–4xx за 2 минуты (последний код: \$code)"
          exit 1
          EOF
