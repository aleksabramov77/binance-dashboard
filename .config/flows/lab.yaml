# /flow lab ["<фокус>"] — лаборатория экспериментов целиком: свой worktree, отчёт по сделкам эпохи из БД, разбор
# агентом quant (решения keep / mirror / tune / pivot / kill), применение подтверждённых решений, карточки новых
# гипотез, журнал прогона в docs/lab (PR, мерж по команде), новый эксперимент — через flow feature.
# Фокус необязателен: id («F06 F07»), группа («все трендовые», «futures»), вопрос («почему S04 в минусе?») или своя
# идея эксперимента («шорт альтов при падении BTC»). Без фокуса — обзор всей эпохи.
# Знания и метод — скилл trading-lab (.claude/skills/trading-lab/), формат артефактов — его references/outputs.md,
# аналитик — .claude/agents/quant.md. Правила CLAUDE.md главнее.
# БД меняется только на этапе apply и только тем, что пользователь подтвердил словами; реальных ордеров нет никогда.
description: Лаборатория — отчёт по сделкам эпохи, разбор экспериментов агентом quant, применение решений по команде, карточки гипотез, журнал прогона в docs/lab (PR и мерж по команде), новый эксперимент через flow feature.
stages:
  - id: worktree
    note: >
      Номер задачи NNNN — `pnpm -s wt next`; run id — `lab-<YYYY-MM-DD>-NNNN`. Из основного checkout
      `pnpm wt new chore/NNNN-lab-<YYYY-MM-DD>`. Все следующие этапы — в этом worktree: БД берётся из его `.env.local`
      (ссылка на основной — это прод Supabase). В основном checkout ничего не менять.
    produces: номер задачи и путь к worktree

  - id: report
    uses: [worktree]
    note: >
      В worktree. Каталог прогона — `docs/lab/runs/<YYYY-MM-DD>-NNNN` (номер задачи берётся из имени ветки — так два
      прогона в один день не перезапишут друг друга). Отчёт всегда по всем экспериментам; фокус с id — добавь к
      команде `--experiment <id>` на каждый (подробные разделы будут только по ним, сводка/семейства/контроль — по
      всем); период («за неделю») — `--since 7d`. Первая строка вывода — «БД: …»: должен быть Postgres (Supabase);
      «локальная PGlite» значит, что `.env.local` не подхватился — остановись и сообщи. Контекст рынка грузится с
      публичного API Binance; нет сети — скрипт продолжит без него и предупредит (передай предупреждение quant).
      Ошибка БД (таймаут пулера) — повторить один раз, потом остановиться и сообщить пользователю.
    run: pnpm -s lab:report --out "docs/lab/runs/$(date +%F)-$(git branch --show-current | sed -E 's#^[a-z]+/([0-9]{4})-.*$#\1#')"
    produces: путь к каталогу прогона (report.md, report.json, trades.csv)

  - id: review
    uses: [report]
    note: >
      Субагент `quant` (Agent, subagent_type quant), режим review: передай путь к каталогу прогона, фокус пользователя
      и предупреждения report. Он пишет review.md в каталог прогона. Пользователю покажи из review.md: раздел
      «Сначала подозрительное», таблицу решений, «Главные выводы» и блок «Действия» с готовой командой lab:apply;
      спроси, что из действий применять: всё, часть (какие id) или ничего. Вопросы пользователя к разбору — тому же
      агенту (SendMessage), ответы он дописывает в review.md.
    produces: путь к review.md
    gate: user-approval

  - id: apply
    uses: [review, report]
    note: >
      Только то, что пользователь явно назвал на гейте review; «ничего» — пропустить с причиной. В worktree: команда из
      блока «Действия» review.md, обрезанная до подтверждённых id, сначала с `--dry-run` (показать «было → стало» и
      строку «БД: …» — должен быть Postgres), затем та же без `--dry-run` и с `--out <каталог прогона>` — apply.md
      попадёт в журнал. Это те же тумблеры, что в /settings и /experiments: реальных ордеров нет, зеркало — Binance
      Demo (без ключей демо скрипт откажется включать зеркало). Ничего сверх подтверждённого.
    produces: путь к apply.md

  - id: ideate
    uses: [review, report]
    note: >
      Тот же агент `quant` (SendMessage; недоступен — новый с путями к report и review), режим ideate: карточки
      гипотез по references/hypothesis-card.md в ideas.md каталога прогона — из tune/pivot разбора, инверсий устойчивых
      провалов (`negative-edge`) и идеи пользователя из фокуса (её оценить честно, вплоть до discard); бэклог
      docs/lab/hypotheses.md и каталог не дублировать, нумерация H<n> сквозная для всех карточек, включая revise и
      discard. Пользователю — карточки pursue по рангу (механизм, одно изменение, сколько ждать, kill) и отклонённые
      одной строкой; спроси, какую одну заводить сейчас, или «ничего» (остальные остаются в бэклоге). Ответ запиши в
      ideas.md разделом «Выбор пользователя» (H<n> или «ничего»).
    produces: путь к ideas.md (с разделом «Выбор пользователя»)
    gate: user-approval

  - id: journal
    uses: [worktree, report, review, apply, ideate]
    note: >
      В worktree, по references/outputs.md скилла trading-lab: запись прогона — в начало `docs/lab/journal.md`
      (новые сверху: период, рынок, решения, применено, карточки и выбор, ссылки на файлы прогона); все карточки из
      ideas.md — строками в `docs/lab/hypotheses.md` (выбранная — `pursue → <id>`, остальные pursue — `backlog`,
      `revise` и `discard` — своими статусами), статусы заведённых раньше — по разделу «Критерии заведённых
      экспериментов» review.md; строка задачи в `docs/HISTORY.md` со статусом «в работе». Коммит
      `NNNN: лаборатория — разбор <дата>` (report.json и trades.csv игнорирует .gitignore — в репо только md), push,
      PR по `docs/ai/conventions.md` → «Pull Request» (`gh` — только с GH_CONFIG_DIR личного конфига): кратко —
      решения и что применено; подробнее — таблица решений, карточки, выбранная гипотеза.
    produces: номер PR журнала

  - id: review-pr
    uses: [journal, report]
    note: >
      Субагент `reviewer` для PR журнала (документация и статусы, без кода): review.md и ideas.md ссылаются на числа
      report.md, решения согласованы с «Действиями» и apply.md, карточки — по шаблону и с кодом для catalog.ts,
      journal.md и hypotheses.md согласованы с ideas.md и выбором пользователя, строка HISTORY.md на месте.
      Без замечаний — label ai-approved. Замечания — исправить в worktree, повторить (до 2 кругов).

  - id: ready
    uses: [journal]
    note: >
      Из worktree. Последним коммитом — строка задачи в `docs/HISTORY.md`: ✅ и номер PR; push. Дождись зелёного CI,
      покажи пользователю PR журнала и спроси, мержить ли.
    run: GH_CONFIG_DIR="$HOME/.config/gh-personal" gh pr checks --watch
    gate: user-approval

  - id: merge
    uses: [journal]
    note: >
      По команде пользователя («мерж»): из основного checkout выполни .claude/skills/merge/SKILL.md для PR журнала.
      Скилл merge вызывает только пользователь, поэтому этап идёт по его тексту. Выкатка не нужна: код не менялся,
      решения уже применены в БД на этапе apply.
    produces: коммит в main

  - id: cleanup
    uses: [worktree]
    note: После мержа, из основного checkout — `pnpm wt remove <ветка задачи>` (удалит worktree и локальную ветку).

  - id: experiment
    flow: feature
    uses: [ideate]
    note: >
      Только если в ideas.md раздел «Выбор пользователя» называет карточку; «ничего» — пропустить. Идёт последним и
      после мержа журнала, чтобы worktree фичи создавался от main с уже влитой строкой журнала (иначе конфликт в
      docs/HISTORY.md). Требование для feature — выбранная карточка из ideas.md как есть: механизм, конфиг, готовый
      фрагмент catalog.ts, контроль, kill/success. Analyst не задаёт вопросов, на которые отвечает карточка. Правила
      кода — скилл trading-lab → «Как эксперимент попадает в лабораторию»: новый id в catalog.ts (обновить
      catalog.test.ts), конфиги работающих экспериментов не менять, новый тип входа/выхода — сначала trading-core с
      тестами. В spec — карточка в «Технических заметках»; критерии приёмки — эксперимент виден в /experiments с
      гипотезой и описанием конфига (describeConfig), тест ядра на новый сигнал, если он есть. Статус карточки в
      docs/lab/hypotheses.md остаётся `pursue → <id>` — следующий `/flow lab` сверит её kill/success с данными.

  - id: close
    uses: [merge]
    note: >
      Шаг «8. Закрытие сессии» из .claude/skills/feature/SKILL.md: итоговый отчёт по этапам, затем последним
      сообщением блок «🎉✅ СЕССИЮ МОЖНО ЗАКРЫВАТЬ ✅🎉» или «⛔ СЕССИЮ ПОКА НЕ ЗАКРЫВАТЬ». Если выполнялся этап
      experiment, его вложенный /flow feature уже вывел свой блок — после отчёта lab повтори итоговый, чтобы он был
      последним. Выкатки в lab нет — для неё «не требовалось».
