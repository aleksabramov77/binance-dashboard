# /flow lab ["<фокус>"] — лаборатория экспериментов целиком: свой worktree, отчёт по сделкам эпохи из БД, разбор
# агентом quant (решения keep / mirror / tune / pivot / kill), применение подтверждённых решений, карточки новых
# гипотез, заведение выбранных экспериментов в private/experiments.json, журнал прогона в приватном репозитории.
# Фокус необязателен: id («F06 F07»), группа («все трендовые», «usdm», «coinm»), вопрос («почему S98 в минусе?») или своя
# идея эксперимента («шорт альтов при падении BTC»). Без фокуса — обзор всей эпохи.
# Приватность (CLAUDE.md, spec 0015): все файлы прогона, журнал, бэклог гипотез и новые эксперименты — только в
# private/ (клон binance-dashboard-private, в worktree — ссылка). В публичный репозиторий — только строка задачи в
# docs/HISTORY.md без цифр, id приватных экспериментов и гипотез (и правки процесса, если они есть).
# Знания и метод — скилл trading-lab (.claude/skills/trading-lab/), формат артефактов — его references/outputs.md,
# аналитик — .claude/agents/quant.md. Правила CLAUDE.md главнее.
# БД меняется только на этапах apply и experiment и только тем, что пользователь подтвердил словами; реальных ордеров
# нет никогда.
description: Лаборатория — отчёт по сделкам эпохи, разбор экспериментов агентом quant, применение решений и заведение новых экспериментов по команде, журнал в приватном репозитории, публичный PR — только строка задачи.
stages:
  - id: worktree
    note: >
      Номер задачи NNNN — `pnpm -s wt next`; run id — `lab-<YYYY-MM-DD>-NNNN`. Из основного checkout
      `pnpm wt new chore/NNNN-lab-<YYYY-MM-DD>`. Все следующие этапы — в этом worktree: БД берётся из его `.env.local`
      (ссылка на основной — это прод Supabase), `private/` — ссылка на клон приватного репозитория основного checkout
      (нет ссылки или клона — остановись: `git clone git@github-personal:aleksabramov77/binance-dashboard-private.git
      private` в основном checkout, затем `pnpm wt link`). В основном checkout ничего не менять. Первым коммитом
      ветки — строка задачи в `docs/HISTORY.md` («Лаборатория — разбор <дата>», статус «в работе», без цифр).
    produces: номер задачи и путь к worktree

  - id: report
    uses: [worktree]
    note: >
      В worktree. Каталог прогона — `private/lab/<YYYY-MM-DD>-NNNN` (номер задачи берётся из имени ветки — так два
      прогона в один день не перезапишут друг друга). Отчёт всегда по всем экспериментам; фокус с id — добавь к
      команде `--experiment <id>` на каждый (подробные разделы будут только по ним, сводка/семейства/контроль — по
      всем); период («за неделю») — `--since 7d`. Первая строка вывода — «БД: …»: должен быть Postgres (Supabase);
      «локальная PGlite» значит, что `.env.local` не подхватился — остановись и сообщи. Контекст рынка грузится с
      публичного API Binance; нет сети — скрипт продолжит без него и предупредит (передай предупреждение quant).
      Ошибка БД (таймаут пулера) — повторить один раз, потом остановиться и сообщить пользователю.
      report.json и trades.csv коммитятся в приватный репозиторий вместе с md: это архив эпохи — после сброса
      капиталов `lab:report` видит только текущую эпоху.
    run: pnpm -s lab:report --out "private/lab/$(date +%F)-$(git branch --show-current | sed -E 's#^[a-z]+/([0-9]{4})-.*$#\1#')"
    produces: путь к каталогу прогона (report.md, report.json, trades.csv)

  - id: review
    uses: [report]
    note: >
      Субагент `quant` (Agent, subagent_type quant), режим review: передай путь к каталогу прогона, фокус пользователя,
      его решения о масштабе (например, лимит включённых экспериментов) и предупреждения report. Он пишет review.md в
      каталог прогона. Пользователю покажи из review.md: раздел «Сначала подозрительное», таблицу решений, «Главные
      выводы» и блок «Действия» с готовой командой lab:apply; спроси, что из действий применять: всё, часть (какие id)
      или ничего. Вопросы пользователя к разбору — тому же агенту (SendMessage), ответы он дописывает в review.md.
      Подозрение на ошибку движка или учёта — отдельный `/bug` (в публичном описании — без параметров приватных
      экспериментов).
    produces: путь к review.md
    gate: user-approval

  - id: apply
    uses: [review, report]
    note: >
      Только то, что пользователь явно назвал на гейте review; «ничего» — пропустить с причиной. В worktree: команда из
      блока «Действия» review.md, обрезанная до подтверждённых id, сначала с `--dry-run` (показать «было → стало» и
      строку «БД: …» — должен быть Postgres), затем та же без `--dry-run` и с `--out <каталог прогона>` — apply.md
      попадёт в журнал. Это те же тумблеры, что в /settings и /experiments: реальных ордеров нет, зеркало — Binance
      Demo (без ключей демо скрипт откажется включать зеркало). Эксперименты не удаляются — только выключаются: их
      сделки остаются в истории. Ничего сверх подтверждённого.
    produces: путь к apply.md

  - id: ideate
    uses: [review, report]
    note: >
      Тот же агент `quant` (SendMessage; недоступен — новый с путями к report и review), режим ideate: карточки
      гипотез по references/hypothesis-card.md в ideas.md каталога прогона — из tune/pivot разбора, инверсий устойчивых
      провалов (`negative-edge`) и идеи пользователя из фокуса (её оценить честно, вплоть до discard); бэклог
      `private/lab/hypotheses.md`, каталог (`catalog.ts`) и `private/experiments.json` не дублировать, нумерация H<n>
      сквозная для всех карточек, включая revise и discard. Каждая карточка — с готовым JSON для
      `private/experiments.json` и пометкой, хватает ли существующих блоков `trading-core` («сейчас») или нужен новый
      («ждёт блок: …»). Лимит pursue — 3 за прогон, если пользователь не задал другой. Пользователю — карточки pursue
      по рангу (механизм, одно изменение, сколько ждать, kill) и отклонённые одной строкой; спроси, какие заводить
      сейчас, или «ничего» (остальные остаются в бэклоге). Ответ запиши в ideas.md разделом «Выбор пользователя».
    produces: путь к ideas.md (с разделом «Выбор пользователя»)
    gate: user-approval

  - id: experiment
    uses: [ideate]
    note: >
      Только карточки из «Выбора пользователя» с пометкой «сейчас»; «ничего» — пропустить. В worktree: JSON карточек —
      в массив `private/experiments.json` (id `PS..`/`PF..`/`PC..` — spot/usdm/coinm, формат — `experimentSchema` из trading-core; конфиги
      уже заведённых экспериментов не менять — изменение = новый id, старый выключается). Затем
      `pnpm -s lab:private --dry-run` (показать цель «БД: …» и план: только «новый» по выбранным id), затем
      `pnpm -s lab:private --prod`. Проверка: эксперименты видны в /experiments. Карточки «ждёт блок» — строками
      `backlog` в hypotheses.md; сам блок (тип входа, выхода, фильтр) заводится отдельной задачей `/flow feature`
      без параметров удачных комбинаций.
    produces: список заведённых id (строка в run-файле)

  - id: journal
    uses: [worktree, report, review, apply, ideate, experiment]
    note: >
      По references/outputs.md скилла trading-lab: запись прогона — в начало `private/lab/journal.md` (новые сверху:
      период, рынок, решения, применено, карточки и выбор, заведённые эксперименты, ссылки на файлы прогона); все
      карточки из ideas.md — строками в `private/lab/hypotheses.md` (заведённая — `pursue → <id>`, остальные pursue —
      `backlog`, `revise` и `discard` — своими статусами), статусы заведённых раньше — по разделу «Критерии
      заведённых экспериментов» review.md. Приватный репозиторий — только свои пути (клон общий для всех worktree, `add -A`
      захватит чужие правки): `git -C private add lab/<дата>-NNNN lab/journal.md lab/hypotheses.md experiments.json &&
      git -C private commit -m "Лаборатория: разбор <дата> (NNNN)"` и push (remote —
      `github-personal:aleksabramov77/binance-dashboard-private`). Публичный репозиторий: строка задачи в
      `docs/HISTORY.md` уже закоммичена на этапе worktree — коммит здесь только если были правки процесса; push, PR по `docs/ai/conventions.md` → «Pull Request» (`gh` — только с GH_CONFIG_DIR
      личного конфига): без цифр, id приватных экспериментов, гипотез и решений — они в приватном журнале.
    produces: номер PR и коммит приватного репозитория

  - id: review-pr
    uses: [journal, report]
    note: >
      Субагент `reviewer` для PR (документация, без кода): в публичном диффе и описании PR нет приватных данных
      (цифры, параметры, id `PS..`/`PF..`/`PC..`, гипотезы); в приватном коммите review.md и ideas.md ссылаются на числа
      report.md, решения согласованы с «Действиями» и apply.md, карточки — по шаблону и с JSON для experiments.json,
      journal.md и hypotheses.md согласованы с ideas.md и выбором пользователя. Замечания по приватным файлам — в
      отчёт оркестратору, не в PR. Без замечаний — label ai-approved. Замечания — исправить в worktree, повторить
      (до 2 кругов).

  - id: ready
    uses: [journal]
    note: >
      Из worktree. Последним коммитом — строка задачи в `docs/HISTORY.md`: ✅ и номер PR; push. Дождись зелёного CI,
      покажи пользователю PR и спроси, мержить ли.
    run: GH_CONFIG_DIR="$HOME/.config/gh-personal" gh pr checks --watch
    gate: user-approval

  - id: merge
    uses: [journal]
    note: >
      По команде пользователя («мерж»): из основного checkout выполни .claude/skills/merge/SKILL.md для PR.
      Скилл merge вызывает только пользователь, поэтому этап идёт по его тексту. Выкатка не нужна: код не менялся,
      решения уже применены в БД на этапах apply и experiment.
    produces: коммит в main

  - id: cleanup
    uses: [worktree]
    note: После мержа, из основного checkout — `pnpm wt remove <ветка задачи>` (удалит worktree и локальную ветку).

  - id: block
    flow: feature
    uses: [ideate]
    note: >
      Только если выбранной карточке нужен новый строительный блок `trading-core` (тип входа, выхода, фильтр) и
      пользователь подтвердил его разработку; иначе пропустить. Идёт после мержа, чтобы worktree фичи создавался от
      main с уже влитой строкой журнала. Требование для feature — только блок: что он делает и как описывается в
      `describeConfig`, без параметров удачных комбинаций, id приватных экспериментов и цифр (репозиторий
      публичный; в spec и тестах — фиктивные примеры, `PS99`). Правила кода — скилл trading-lab → «Как эксперимент
      попадает в лабораторию». После выкатки блока карточка заводится следующим `/flow lab` (этап experiment):
      worktree этого прогона к тому времени уже удалён.

  - id: close
    uses: [merge]
    note: >
      Шаг «8. Закрытие сессии» из .claude/skills/feature/SKILL.md: итоговый отчёт по этапам, затем последним
      сообщением блок «🎉✅ СЕССИЮ МОЖНО ЗАКРЫВАТЬ ✅🎉» или «⛔ СЕССИЮ ПОКА НЕ ЗАКРЫВАТЬ». Если выполнялся этап block,
      его вложенный /flow feature уже вывел свой блок — после отчёта lab повтори итоговый, чтобы он был последним.
      Выкатки в lab нет — для неё «не требовалось». Хвост — незапушенный приватный репозиторий: `git -C private
      status` должен быть чистым и без ahead.
