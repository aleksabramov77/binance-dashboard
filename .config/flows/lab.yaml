# /flow lab ["<фокус>"] — лаборатория экспериментов: разбор удачных и неудачных экспериментов по сделкам из БД,
# идеи новых и (по выбору пользователя) заведение нового эксперимента целиком через flow feature.
# Фокус необязателен: id экспериментов («F06 F07»), группа («все трендовые», «futures»), вопрос («почему S04 в минусе?»)
# или своя идея эксперимента («шорт альтов при падении BTC»). Без фокуса — обзор всей эпохи.
# Знания и метод — скилл trading-lab (.claude/skills/trading-lab/). Правила CLAUDE.md главнее.
# Разбор только читает БД: тумблеры экспериментов, сбросы и демо-зеркало включает пользователь в /settings сам.
description: Лаборатория — отчёт по сделкам эпохи, разбор удачных и неудачных экспериментов, карточки новых гипотез, новый эксперимент через flow feature.
stages:
  - id: report
    note: >
      Из основного checkout (БД — из его .env.local; ничего не пишет). Run id — `lab-<дата>` или `lab-<фокус-slug>`.
      Фокус с id экспериментов — добавь `--experiment <id>` на каждый; с периодом («за неделю») — `--since 7d`.
      Каталог вывода — каталог прогона `$(git rev-parse --git-dir)/flow/<run-id>`. Ошибка подключения к БД
      (нет DATABASE_URL, таймаут пулера) — сообщи пользователю, не подставляй PGlite: локальная БД пуста.
    run: pnpm -s lab:report --out "$(git rev-parse --git-dir)/flow/<run-id>"
    produces: путь к report.md (рядом report.json)

  - id: review
    uses: [report]
    skills: [trading-lab]
    note: >
      Разбор по «Разбор эксперимента: порядок вопросов» из скилла trading-lab — по фокусу, без фокуса — по всем
      экспериментам эпохи. Читай report.md, за деталями — report.json. Для каждого эксперимента: данных хватает?,
      перевес и t, сравнение с контролем рынка, откуда результат (разрезы, MFE), причина по failure-modes.md,
      решение keep | mirror | tune | pivot | kill. Отдельно: топ удачных и топ неудачных, подозрительные
      (сначала ошибка), что выключить и что зеркалить — списком действий для пользователя в /settings. Итог —
      review.md в каталоге прогона. Пользователю — таблица решений и 3–5 главных выводов.
    produces: путь к review.md
    gate: user-approval

  - id: ideate
    uses: [review, report]
    skills: [trading-lab]
    note: >
      Карточки гипотез по references/hypothesis-card.md: из tune/pivot разбора, инверсий устойчивых провалов и идеи
      пользователя из фокуса (её тоже оценить картой честно, вплоть до discard). Не больше 3 карточек pursue, не
      дублировать существующие эксперименты каталога (src/features/paper-engine/config/catalog.ts). Итог — ideas.md в
      каталоге прогона. Спроси пользователя, какую одну карточку заводить сейчас, или «ничего» — тогда прогон
      заканчивается здесь: остальные карточки остаются в ideas.md для следующих прогонов.
    produces: путь к ideas.md и выбранная карточка (H<n>) или «ничего»
    gate: user-approval

  - id: experiment
    flow: feature
    uses: [ideate]
    note: >
      Только если в ideate выбрана карточка; «ничего» — пропустить. Требование для feature — выбранная карточка из
      ideas.md как есть (механизм, конфиг, контроль, kill/success). Новый эксперимент — новый id в catalog.ts, конфиги
      работающих экспериментов не менять; новый тип входа/выхода — сначала trading-core с тестами (скилл
      trading-lab → «Как эксперимент попадает в лабораторию»). В spec — карточка целиком в разделе «Контекст»,
      критерии приёмки — эксперимент виден в /experiments с гипотезой и описанием конфига, тест ядра на новый сигнал.
      Одна карточка — одна задача; следующая — новым прогоном /flow lab или /flow feature.
