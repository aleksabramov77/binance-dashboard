# /flow bug "<что сломалось>" — баг целиком, как feature: свой worktree, падающий тест → фикс, проверка на локальном
# сервере worktree до PR и после правок по ревью, мерж по команде пользователя, выкатка, удаление worktree.
# Как выполнять этапы — .claude/skills/bug/SKILL.md (Analyst бага) и .claude/skills/feature/SKILL.md (остальные шаги).
description: Баг целиком — worktree, воспроизведение и ТЗ, фикс через падающий тест, проверка на локальном сервере, PR и ревью с перепроверкой, мерж по команде, выкатка, удаление worktree, сообщение «сессию можно закрывать».
stages:
  - id: worktree
    note: >
      Номер задачи — `pnpm -s wt next`, slug — kebab-case по описанию бага; из основного checkout
      `pnpm wt new bug/NNNN-slug` (срочный фикс прода — `hotfix/NNNN-slug`). Все следующие этапы — в этом worktree;
      в основном checkout ветки не переключать и файлов не создавать.
    produces: номер задачи и путь к worktree

  - id: spec
    uses: [worktree]
    note: >
      Шаг «1. Analyst (баг)» из .claude/skills/bug/SKILL.md, в worktree: факты из журнала и кода,
      docs/specs/NNNN-slug.md по шаблону бага, строка docs/HISTORY.md «в работе», утверждение.
    produces: путь к spec
    gate: user-approval

  - id: develop
    uses: [spec, worktree]
    note: >
      Утверждённое ТЗ — первым коммитом ветки (`NNNN: ТЗ — <название>`). Затем субагент developer в worktree: сначала
      тест, который воспроизводит баг и падает, потом фикс; раздел «Причина» в spec (.claude/skills/bug/SKILL.md →
      «Особенности для Developer»).
    produces: ветка задачи

  - id: check
    uses: [worktree]
    note: В worktree. Красное — назад в develop.
    run: pnpm check && pnpm build

  - id: serve
    uses: [worktree]
    note: В worktree. Сервер работает на своей PGlite и без входа — прод не трогается.
    run: pnpm wt serve
    produces: адрес локального сервера

  - id: test
    uses: [spec, serve]
    note: >
      Субагент tester на адресе из serve: все AC и исходные шаги воспроизведения — баг не повторяется. FAIL → develop →
      check → test, до 3 кругов, потом — к пользователю. PASS → таблица AC и скриншоты пользователю.
    gate: user-approval

  - id: pr
    uses: [spec]
    note: >
      Developer открывает PR: заголовок `NNNN: что исправлено`, в описании — что исправлено, сначала кратко, потом
      подробнее.
    produces: номер PR

  - id: review
    uses: [pr, spec, serve]
    note: >
      Субагент reviewer. CHANGES REQUESTED → developer правит → check → tester снова проходит AC и шаги
      воспроизведения на локальном сервере worktree → снова reviewer. До 3 кругов. Итог — label ai-approved.

  - id: ready
    uses: [pr]
    note: >
      Последним коммитом — статусы spec и PRD, строка docs/HISTORY.md (✅, PR); зелёный CI. Покажи пользователю PR и
      спроси, мержить ли.
    run: GH_CONFIG_DIR="$HOME/.config/gh-personal" gh pr checks --watch
    gate: user-approval

  - id: merge
    uses: [pr]
    note: >
      Мерж по команде пользователя («мерж»): из основного checkout выполни .claude/skills/merge/SKILL.md для этого PR.
    produces: коммит в main

  - id: release
    flow: release
    uses: [merge]

  - id: cleanup
    uses: [worktree]
    note: >
      После мержа и выкатки, из основного checkout: `pnpm wt remove <ветка задачи>` — остановит сервер, удалит worktree
      и локальную ветку.

  - id: close
    uses: [pr, merge]
    note: >
      Шаг «8. Закрытие сессии» из .claude/skills/feature/SKILL.md — последнее сообщение сессии. Сам проверь хвосты
      (PR влит и выкачен, баг не повторяется на проде, worktree, ветки, серверы и фоновые задачи убраны, незакоммиченного
      нет; согласованная и не выполненная работа, которую ведёт эта сессия (`docs/PRD.md` → «Очередь задач»), — тоже хвост), оповести другие живые сессии о том, что их касается, и выведи яркий блок
      «🎉✅ СЕССИЮ МОЖНО ЗАКРЫВАТЬ ✅🎉» — или «⛔ СЕССИЮ ПОКА НЕ ЗАКРЫВАТЬ» со списком хвостов. Итоговый отчёт
      по этапам — до блока, блок — самым последним.
